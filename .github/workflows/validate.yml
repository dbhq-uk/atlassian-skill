name: Validate

on:
  push:
  pull_request:

# The default for every job below. A job that needs more declares it itself;
# an explicit floor here means a new job cannot silently inherit an org
# setting somebody widened.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # No `version` in plugin.json, on purpose (24 Sep 2026). Claude Code only
      # updates an installed plugin when this field changes, it was never bumped,
      # and marketplace installs sat on old code for weeks. With no version the
      # commit is the version, so every merge to main reaches users.
      - name: plugin.json carries no version
        run: jq -e 'has("version") | not' .claude-plugin/plugin.json > /dev/null

      - name: Plugin manifest is valid JSON
        run: jq empty .claude-plugin/plugin.json

      - name: Every SKILL.md has name and description frontmatter
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          ok = True
          for skill in sorted(pathlib.Path("skills").glob("*/SKILL.md")):
              text = skill.read_text(encoding="utf-8")
              match = re.match(r"^---\n(.*?)\n---", text, re.S)
              if not match:
                  print(f"{skill}: no frontmatter")
                  ok = False
                  continue
              for key in ("name:", "description:"):
                  if key not in match.group(1):
                      print(f"{skill}: missing {key}")
                      ok = False
          sys.exit(0 if ok else 1)
          PY

      # skills.sh (`npx skills add`) copies only a folder that holds a
      # SKILL.md. Until 25 Sep 2026 every script here reached a _shared
      # folder with ../, _shared had no SKILL.md, and so every script failed
      # on its first line after that install. A skill folder must carry
      # everything it runs. tests/ is exempt: it never ships to an agent.
      - name: No skill reaches outside its own folder
        run: |
          if grep -rnF --exclude-dir=tests --exclude-dir=__pycache__ '../' skills/; then
            echo "A skill reaches outside its own folder with ../ - see above." >&2
            echo "Fix: keep every script and reference the skill uses inside skills/<name>/." >&2
            exit 1
          fi

      - name: Python tests
        # skills/atlassian/tests holds the converter suite (test_htmlplus.py),
        # the markdown and frontmatter suite (test_publish.py), the
        # attachment upload guard (test_attachments.py) and the repo-wide
        # constraint suite (test_constraints.py, run again below on its own).
        run: python3 -m unittest discover -s skills/atlassian/tests -v

      - name: Nothing client-specific reached this public repository
        # test_constraints.py is the one place this rule lives - em dashes,
        # a client's name, a security-proxy host, a real-looking ticket id,
        # an IP address, a source proper noun that slipped past those
        # shapes, plus the house-style write path and the ~/.dbhq/jira ->
        # ~/.dbhq/atlassian credential move. It already ran once above as
        # part of "Python tests"; run again here, named on its own, so a
        # failure in this specific gate is not buried inside a long test
        # log - and so nobody re-adds a second copy of these patterns as a
        # grep, which is what this step used to be.
        run: python3 -m unittest skills.atlassian.tests.test_constraints -v

      # Every .sh and .py file in the repo - install.sh, install-codex.sh and
      # everything under skills/atlassian/ - is already shellchecked and
      # syntax-checked by the "lint" job below, added 17 Sep 2026 across
      # every DBHQ skill repo. This job does not run shellcheck or py_compile
      # a second time; see that job's own comment for why it is scoped the
      # way it is.

  # THE SAME TWO LINTERS IN EVERY DBHQ SKILL REPO, added 17 Sep 2026. Nine of
  # the fourteen ran no linter at all, in an estate that is mostly bash and
  # Python - so a shell quoting hazard or a name that does not exist was only
  # caught by somebody reading the diff.
  #
  # IT IS A DELIBERATELY NARROW RUFF SELECTION. `E9` is syntax errors and
  # `F` is the pyflakes set: undefined names, unused imports, f-strings with no
  # placeholders. Those are bugs. The full default selection flags import order
  # and whitespace across every one of these repos, which would have meant
  # reformatting thousands of lines in code other sessions are working in
  # before the gate could go green - a large diff to buy a gate that catches
  # less than this one does. garmin and imager run the full ruff and keep it.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: shellcheck
        # -S warning, not the default, because `info` and `style` fire on
        # idioms these scripts use deliberately. -x follows the
        # `# shellcheck source=` directives that pull in _common.sh, which
        # shellcheck cannot check without it. xargs -r so a repo with no
        # shell scripts is a pass rather than a shellcheck usage error.
        run: |
          find . -name '*.sh' -not -path '*/.venv/*' -print0 \
            | xargs -0 -r shellcheck -S warning -x

      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5
        with:
          python-version: "3.11"

      - name: ruff - syntax errors and undefined names
        run: |
          pip install --quiet ruff
          ruff check . --select E9,F --exclude .venv
