name: Validate

on:
  push:
  pull_request:

# The default for every job below. A job that needs more declares it itself;
# an explicit floor here means a new job cannot silently inherit an org
# setting somebody widened.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Plugin manifest is valid JSON
        run: jq empty .claude-plugin/plugin.json

      - name: Every SKILL.md has name and description frontmatter
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          ok = True
          for skill in sorted(pathlib.Path("skills").glob("*/SKILL.md")):
              text = skill.read_text(encoding="utf-8")
              match = re.match(r"^---\n(.*?)\n---", text, re.S)
              if not match:
                  print(f"{skill}: no frontmatter")
                  ok = False
                  continue
              for key in ("name:", "description:"):
                  if key not in match.group(1):
                      print(f"{skill}: missing {key}")
                      ok = False
          sys.exit(0 if ok else 1)
          PY

      - name: Python tests
        # Both directories that carry a tests/ folder. skills/_shared/tests
        # holds the converter suite (test_htmlplus.py) and the repo-wide
        # constraint suite (test_constraints.py, run again below on its
        # own); skills/confluence-publish/tests holds the markdown-to-HTML+
        # and frontmatter suite. jira and confluence have no scripts this
        # skill family's Python touches directly, so they carry no tests/
        # directory of their own - _common.sh and the API calls are bash,
        # exercised live rather than unit-tested.
        run: |
          python3 -m unittest discover -s skills/_shared/tests -v
          python3 -m unittest discover -s skills/confluence-publish/tests -v

      - name: Nothing client-specific reached this public repository
        # test_constraints.py (Task 8) is the one place this rule lives - em
        # dashes, a client's name, a security-proxy host, a real-looking
        # ticket id, an IP address, a source proper noun that slipped past
        # those shapes, plus (Task 16) the house-style write path and the
        # ~/.dbhq/jira -> ~/.dbhq/atlassian credential move. It already ran
        # once above as part of "Python tests"; run again here, named on its
        # own, so a failure in this specific gate is not buried inside a
        # 150-plus-test log - and so nobody re-adds a second copy of these
        # patterns as a grep, which is what this step used to be.
        run: python3 -m unittest skills._shared.tests.test_constraints -v

      # Every .sh and .py file in the repo - install.sh, install-codex.sh and
      # all four skills/*/ directories - is already shellchecked and
      # syntax-checked by the "lint" job below, added 17 Sep 2026 across
      # every DBHQ skill repo. This job does not run shellcheck or py_compile
      # a second time; see that job's own comment for why it is scoped the
      # way it is.

  # THE SAME TWO LINTERS IN EVERY DBHQ SKILL REPO, added 17 Sep 2026. Nine of
  # the fourteen ran no linter at all, in an estate that is mostly bash and
  # Python - so a shell quoting hazard or a name that does not exist was only
  # caught by somebody reading the diff.
  #
  # IT IS A DELIBERATELY NARROW RUFF SELECTION. `E9` is syntax errors and
  # `F` is the pyflakes set: undefined names, unused imports, f-strings with no
  # placeholders. Those are bugs. The full default selection flags import order
  # and whitespace across every one of these repos, which would have meant
  # reformatting thousands of lines in code other sessions are working in
  # before the gate could go green - a large diff to buy a gate that catches
  # less than this one does. garmin and imager run the full ruff and keep it.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: shellcheck
        # -S warning, not the default, because `info` and `style` fire on
        # idioms these scripts use deliberately. xargs -r so a repo with no
        # shell scripts is a pass rather than a shellcheck usage error.
        run: |
          find . -name '*.sh' -not -path '*/.venv/*' -print0 \
            | xargs -0 -r shellcheck -S warning

      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5
        with:
          python-version: "3.11"

      - name: ruff - syntax errors and undefined names
        run: |
          pip install --quiet ruff
          ruff check . --select E9,F --exclude .venv
