name: Validate

on:
  push:
  pull_request:

# The default for every job below. A job that needs more declares it itself;
# an explicit floor here means a new job cannot silently inherit an org
# setting somebody widened.
permissions:
  contents: read

jobs:
  # THE ESTATE FLOOR, defined once in dbhq-uk/.github (dbhq-uk/.github#4):
  # SKILL.md frontmatter parses as YAML and names its directory, plugin.json
  # parses and carries no version, skill paths are braced, every shell script
  # passes bash -n and shellcheck, ruff E9,F, and no em or en dashes. Pinned
  # by SHA; Dependabot moves the pin.
  floor:
    uses: dbhq-uk/.github/.github/workflows/skill-floor.yml@af131df509f44eb9abfe8b37ad6299c11f496c5f

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # skills.sh (`npx skills add`) copies only a folder that holds a
      # SKILL.md. Until 25 Sep 2026 every script here reached a _shared
      # folder with ../, _shared had no SKILL.md, and so every script failed
      # on its first line after that install. A skill folder must carry
      # everything it runs. tests/ is exempt: it never ships to an agent.
      - name: No skill reaches outside its own folder
        run: |
          if grep -rnF --exclude-dir=tests --exclude-dir=__pycache__ '../' skills/; then
            echo "A skill reaches outside its own folder with ../ - see above." >&2
            echo "Fix: keep every script and reference the skill uses inside skills/<name>/." >&2
            exit 1
          fi

      - name: Python tests
        # skills/atlassian/tests holds the converter suite (test_htmlplus.py),
        # the markdown and frontmatter suite (test_publish.py), the
        # attachment upload guard (test_attachments.py) and the repo-wide
        # constraint suite (test_constraints.py, run again below on its own).
        run: python3 -m unittest discover -s skills/atlassian/tests -v

      - name: Nothing client-specific reached this public repository
        # test_constraints.py is the one place this rule lives - em dashes,
        # a client's name, a security-proxy host, a real-looking ticket id,
        # an IP address, a source proper noun that slipped past those
        # shapes, plus the house-style write path and the ~/.dbhq/jira ->
        # ~/.dbhq/atlassian credential move. It already ran once above as
        # part of "Python tests"; run again here, named on its own, so a
        # failure in this specific gate is not buried inside a long test
        # log - and so nobody re-adds a second copy of these patterns as a
        # grep, which is what this step used to be.
        run: python3 -m unittest skills.atlassian.tests.test_constraints -v

      # Every .sh and .py file in the repo - install.sh, install-codex.sh and
      # everything under skills/atlassian/ - is shellchecked (with -x, so the
      # `# shellcheck source=` directives into _common.sh are followed) and
      # ruff-checked by the floor job above. This job does not run either a
      # second time.
